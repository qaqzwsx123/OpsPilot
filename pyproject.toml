[project]
name = "safe-sql-agent"
version = "0.1.0"
description = "A safe, observable SQL Agent demo with workflow, approval and RAG fallback."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<0.111",
  "uvicorn>=0.30,<1.0",
  "pydantic>=2.0,<3.0",
  "chromadb>=1.5,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "httpx>=0.27,<1.0"]
mysql = ["PyMySQL>=1.1,<2.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
